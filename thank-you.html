<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Friday AI</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .thank-you-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .thank-you-card {
            max-width: 600px;
            padding: 60px 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .thank-you-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
        }
        .thank-you-card h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        .thank-you-card p {
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .thank-you-card a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .thank-you-card a:hover {
            text-decoration: underline;
        }
        .thank-you-details {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .thank-you-details p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="thank-you-card">
            <div class="thank-you-icon">✓</div>
            <h1>Thank You!</h1>
            <p>Your message has been sent successfully. We'll get back to you within 24 hours.</p>
            <p><a href="index.html">← Back to Home</a></p>
            <div class="thank-you-details">
                <p>Friday AI — Intelligent Automation Platform</p>
                <p>hello@friday.ai</p>
            </div>
        </div>
    </div>
</body>
</html>
